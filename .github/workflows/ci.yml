name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev

      - name: Build frontend
        run: |
          cd frontend && yarn install --frozen-lockfile && yarn build && cd ..
          rm -rf cmd/go-mumble-server/frontend-dist
          cp -r frontend/dist cmd/go-mumble-server/frontend-dist

      - name: Download Go modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Test
        run: CGO_ENABLED=1 go test -race -v ./...

      - name: Build
        run: CGO_ENABLED=1 go build -tags embed_frontend -o /dev/null ./cmd/go-mumble-server
